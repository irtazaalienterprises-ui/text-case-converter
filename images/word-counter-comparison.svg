<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Word Counter screenshot preview</title>
<desc id="desc">Word Counter interface with the text Tool Counter and visible word and character results.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c35"/><stop offset="1" stop-color="#211a3e"/></linearGradient><linearGradient id="button" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8057f5"/><stop offset="1" stop-color="#43c9f5"/></linearGradient></defs>
<rect width="1200" height="520" fill="url(#bg)"/>
<rect x="30" y="28" width="1140" height="464" rx="22" fill="#101c30" stroke="#344256"/>
<text x="54" y="70" fill="#f3f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">Count Words Online</text>
<text x="54" y="101" fill="#9aa8bd" font-family="Arial,sans-serif" font-size="17">Type or paste your text below to get instant word count analytics.</text>
